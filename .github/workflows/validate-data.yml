name: Validate OSS Time Data

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/construct_oss_time_datasets.py --check-only
      - run: python scripts/construct_oss_time_datasets.py
      - name: Check reproducible CSV outputs
        run: git diff --exit-code -- data/processed_time
